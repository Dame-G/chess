[package]
name = "data"
description = "Training data for Dameless's nets: viriformat, Reckless's rbinpack, Stockfish binpack; conversion, filters, stats, shuffling, rescoring, datagen and manifests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "data"

[[bin]]
name = "data"
path = "src/main.rs"

# A tiny UCI engine (legal moves and a material score, nothing more) for the datagen and rescoring tests, so they run
# without Reckless. Integration tests find it through `CARGO_BIN_EXE_fake-uci`.
[[bin]]
name = "fake-uci"
path = "tests/support/fake_uci.rs"
test = false
doc = false

[dependencies]
anyhow.workspace = true
bulletformat.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sfbinpack.workspace = true
sha2.workspace = true
shakmaty.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Viridithas's own reader, to check that our viriformat is byte-compatible with what bullet loads.
viriformat.workspace = true
