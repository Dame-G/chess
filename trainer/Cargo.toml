[workspace]
resolver = "3"
members = ["reference", "data"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dame-G/dameless"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
sha2 = "0.11.1"
shakmaty = "0.30.2"
# trainer/data
bulletformat = "1.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sfbinpack = "0.6.5"
tempfile = "3.27.0"
viriformat = "3.0.0"

[profile.release]
lto = "thin"
codegen-units = 1

# The reference is plain integer and float arithmetic; tests run it thousands of times.
[profile.test]
opt-level = 3

[profile.dev]
opt-level = 1
