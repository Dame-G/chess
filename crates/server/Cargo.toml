[package]
name = "dameless"
description = "The Dameless app: the HTTP API, the event stream and the CLI, in one binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "dameless"
path = "src/main.rs"

# A tiny UCI engine that knows the rules but not chess (analysis's test engine, shared), so the app's tests play games,
# evaluate and review without Reckless. Integration tests find it through `CARGO_BIN_EXE_dameless-fake-engine`.
[[bin]]
name = "dameless-fake-engine"
path = "../analysis/tests/support/fake_eval.rs"
test = false
doc = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros"] }
clap.workspace = true
dameless-analysis.workspace = true
dameless-core.workspace = true
dameless-engine.workspace = true
dameless-hub.workspace = true
dameless-lichess.workspace = true
dameless-play.workspace = true
dameless-store.workspace = true
dameless-work.workspace = true
futures.workspace = true
mime_guess.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
dameless-lichess = { workspace = true, features = ["mock"] }
tempfile.workspace = true
