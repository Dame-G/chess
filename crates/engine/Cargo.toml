[package]
name = "dameless-engine"
description = "Adapter: UCI processes, the engine pool, git and cargo builds, bench, fastchess."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zip.workspace = true

# A tiny UCI engine that speaks just enough of the protocol for the tests of `uci`, `pool` and `bench`, so they run
# without Reckless. Integration tests find it through `CARGO_BIN_EXE_fake-uci`.
[[bin]]
name = "fake-uci"
path = "tests/support/fake_uci.rs"
test = false
doc = false
