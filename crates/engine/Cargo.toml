[package]
name = "dameless-engine"
description = "Adapter: UCI processes, the engine pool, downloads of the built-in engines."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
futures.workspace = true
process-wrap.workspace = true
reqwest.workspace = true
serde.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zip.workspace = true

# A tiny UCI engine that speaks just enough of the protocol for the tests of `uci` and `pool`, so they run
# without a real engine. Integration tests find it through `CARGO_BIN_EXE_fake-uci`.
[[bin]]
name = "fake-uci"
path = "tests/support/fake_uci.rs"
test = false
doc = false

[dev-dependencies]
serde_json.workspace = true
