[package]
name = "dameless-play"
description = "The Referee runtime: game tasks and seat controllers (engine, local, Lichess board, Lichess bot)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dameless-core.workspace = true
dameless-engine.workspace = true
dameless-hub.workspace = true
dameless-lichess.workspace = true
dameless-store.workspace = true
dameless-work.workspace = true
futures.workspace = true
getrandom.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
dameless-lichess = { workspace = true, features = ["mock"] }
tempfile.workspace = true

# A tiny UCI engine that plays legal (if aimless) chess, for the tests of the Referee runtime, so they run without
# Reckless. Integration tests find it through `CARGO_BIN_EXE_play-fake-uci`.
[[bin]]
name = "play-fake-uci"
path = "tests/support/fake_engine.rs"
test = false
doc = false
