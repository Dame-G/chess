[workspace]
resolver = "3"
members = ["crates/*"]
# Data directories in the repo hold engine worktrees, which cargo must not take for members of this workspace.
exclude = [".data", ".data-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Dame-G/chess"

[workspace.dependencies]
# Ours
chess-core = { path = "crates/core" }
chess-hub = { path = "crates/hub" }
chess-store = { path = "crates/store" }
chess-engine = { path = "crates/engine" }
chess-lichess = { path = "crates/lichess" }
chess-play = { path = "crates/play" }
chess-analysis = { path = "crates/analysis" }
chess-work = { path = "crates/work" }

# Theirs
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
futures = "0.3.34"
getrandom = "0.4.3"
mime_guess = "2.0.5"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
regex-lite = "0.1.9"
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "stream", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shakmaty = "0.30.2"
sysinfo = "0.39.6"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
zstd = "0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
