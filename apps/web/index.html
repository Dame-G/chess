<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Scripts only from this origin, and the API only on this origin or a server on this machine (the hosted app's case).
      Styles may be inline: the theme is a <style> element. Frame-ancestors cannot be set here; it is a header
      (public/_headers on Cloudflare, the server's own responses locally).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <script src="/scheme.js"></script>
    <!-- Page ground until the stylesheet arrives: Saddle's background in each scheme. -->
    <style>
      html {
        background: #efe6d8;
      }
      html[data-scheme="dark"] {
        background: #14100d;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Chess</title>
    <meta name="description" content="You and your engine, getting stronger at one board." />
  </head>
  <body>
    <div id="app" class="e-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
